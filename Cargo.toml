[package]
name = "hyprsechy"
version = "0.1.0"
edition = "2021"
authors = ["ngodn <ngodn@example.com>"]
description = "Hyprland Session Management Service with UWSM Integration"
license = "MIT"
repository = "https://github.com/ngodn/hyprsechy"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI interface
clap = { version = "4.0", features = ["derive"] }

# Systemd integration
systemd = "0.10"

# Unix domain sockets
tokio-util = { version = "0.7", features = ["codec"] }

# XDG directories
dirs = "5.0"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
toml = "0.8"

# Desktop entry parsing
freedesktop-desktop-entry = "0.5"

# Async filesystem operations
tokio-fs = "0.1"

# Process management
nix = { version = "0.27", features = ["process", "signal"] }

# TUI interface
ratatui = "0.28"
crossterm = "0.28"

# Utility
which = "6.0"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "hyprsechy"
path = "src/main.rs"

[[bin]]
name = "hyprsechy-restore"
path = "src/restore_tui.rs"
